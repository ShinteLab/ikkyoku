version: '3'

vars:
  APP_NAME: "ikkyoku"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  # 個人用の local:deploy（ビルド → 常用場所へコピー）。git に入れないファイルなので
  # ⚠️ optional を外さないこと（無い環境で wails3 build / dev まで落ちる）。
  # 作り方はスキル ikkyoku-build（雛形は _docs/skills/ikkyoku-build/references/Taskfile.local.yml）。
  local:
    taskfile: Taskfile.local.yml
    optional: true
  # ikkyoku はデスクトップ専用(将棋中継のキャプチャ用)。
  # ios / android は対象外なので includes から外してある(wails3 skill setup.md 参照)。

tasks:
  model:copy:
    summary: 配布ビルド用に suteme の認識器(dist/)を recognize/model/ へ持ってくる
    # **-tags embedmodel でビルドする前に一度走らせる。** データはリポジトリに
    # 置いていないので、これを忘れると go:embed がファイルを見つけられず
    # ビルドが止まる(それが狙い。古いデータで配るより止まったほうがよい)。
    # suteme を ikkyoku の隣に置いていないときは SUTEME_DIST で dist/ を指す
    # (wails3 task model:copy SUTEME_DIST=D:/path/to/suteme/dist)。
    # ⚠️ **-- の後ろの引数では渡せない**(wails3 task は CLI_ARGS を持たない。KEY=VALUE だけ)。
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File ./build/copy-model.ps1{{if .SUTEME_DIST}} -Dist "{{.SUTEME_DIST}}"{{end}}

  build:embed:
    summary: 認識器を焼き込んだ配布ビルド(exe 1 つで動く)
    cmds:
      - task: model:copy
      # ⚠️ **BUILD_FLAGS を上書きしないこと。** あちらには -tags production や
      # -H windowsgui(コンソールを出さない)まで入っている。タグを足す口は EXTRA_TAGS。
      - task: "{{.GOOS}}:build"
        vars:
          EXTRA_TAGS: 'embedmodel'

  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
